name: lzvideo Build (Windows Portable)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Portable
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop

      - name: Resolve packages
        run: flutter pub get

      - name: Generate production AppConfig
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $lines = Get-Content pubspec.yaml
          foreach ($line in $lines) {
            if ($line -match '^\s*version:\s*(\S+)') {
              $fullVersion = $matches[1] -replace '[`"''`]', ''
              $displayVersion = $fullVersion.Split('+')[0]
              $artifactVersion = $fullVersion.Replace('+', '-')
              "version=$displayVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "artifact_version=$artifactVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
          }

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create Windows portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "build\windows\x64\runner\Release"
          mkdir dist_windows -Force | Out-Null
          $portable = "dist_windows\lzvideo-$version-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "lzvideo-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object {
              $_.Name -notin @("AppData", "IPTV_CACHE")
            } |
            Copy-Item -Destination $temporary -Recurse -Force
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          Write-Host "Created portable archive: $portable"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lzvideo-Windows-Portable
          path: dist_windows/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}-windows
          name: lzvideo v${{ steps.version.outputs.version }} Windows Portable
          body: |
            ## lzvideo v${{ steps.version.outputs.version }} Windows 绿色便携版
            - 修复直播间画面偶发黑屏问题
            - 新增主播下播自动停止录制并合并保存 MP4 视频
            - 解压即用，独立数据隔离
          files: |
            dist_windows/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
